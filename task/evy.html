<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <title>Patient Registration - Interactive</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a2a44;
            margin: 0;
            padding: 20px;
        }

        
        .header {
            background-color: #7ab356;
            padding: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 26px;
            border: 2px solid black;
            margin-bottom: 20px;
        }

        .container { display: flex; gap: 20px; }

        
        .sidebar {
            background-color: #00b0f0;
            width: 200px;
            padding: 20px;
            border: 2px solid black;
            min-height: 500px;
        }

        .menu-link {
            display: block;
            text-decoration: none;
            color: black;
            padding: 12px;
            font-size: 18px;
            margin-bottom: 5px;
            border-radius: 4px;
        }

        .menu-link:hover { background-color: rgba(255,255,255,0.3); }

        
        .content { flex-grow: 1; }

        .form-box {
            background-color: #5b9bd5;
            padding: 30px;
            border: 2px solid black;
        }

        .form-title { font-weight: bold; font-size: 20px; margin-bottom: 25px; }

        .input-group { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }

        .field { display: flex; flex-direction: column; }

        label { font-weight: bold; margin-bottom: 5px; }

        input {
            padding: 10px;
            border: 1px solid black;
            font-size: 16px;
        }

        
        .btn-group {
            display: flex;
            gap: 30px;
            margin-top: 30px;
        }

        .action-btn {
            background-color: #d9d9d9;
            color: black;
            padding: 10px 35px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid black;
            cursor: pointer; 
            transition: all 0.2s;
            text-transform: uppercase;
        }

    
        .action-btn:hover {
            background-color: #ffffff;
            transform: scale(1.05);
            box-shadow: 3px 3px 0px black;
        }

        
        .action-btn:active {
            transform: scale(0.95);
            box-shadow: none;
        }

        .status-bar {
            background-color: #5b9bd5;
            padding: 15px;
            border: 2px solid black;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">PATIENT REGISTRATION</div>

    <div class="container">
        <nav class="sidebar">
            <h3 style="margin-left: 12px;">Menu</h3>
            <a href="iu.html" class="menu-link">Dashboard</a>
            <a href="evy.html" class="menu-link">Patient</a>
            <a href="del.html" class="menu-link">Appointment</a>
            <a href="de.html" class="menu-link">Report</a>
            <a href="ju.html" class="menu-link">Setting</a>
        </nav>

        <div class="content">
            <div class="form-box">
                <div class="form-title">New Patient Form</div>
                
                <div class="input-group">
                    <div class="field">
                        <label>Full name</label>
                        <input type="text" placeholder="Enter name">
                    </div>
                    <div class="field">
                        <label>Age</label>
                        <input type="number" style="width: 80px;">
                    </div>
                    <div class="field">
                        <label>Gender</label>
                        <input type="text" style="width: 100px;">
                    </div>
                </div>

                <div class="input-group">
                    <div class="field">
                        <label>Phone number</label>
                        <input type="text">
                    </div>
                    <div class="field">
                        <label>Nation ID</label>
                        <input type="text">
                    </div>
                </div>

                <div class="field">
                    <label>Address</label>
                    <input type="text" style="width: 90%;">
                </div>

                <div class="btn-group">
                    <button class="action-btn" onclick="alert('Data Sent Successfully!')">SEND</button>
                    <button class="action-btn" onclick="alert('Data Saved Successfully!')">SAVE</button>
                    <button class="action-btn" onclick="window.print()">PRINT</button>
                </div>
            </div>

            <div class="status-bar">
                We are ready to register the patient into the system.
            </div>
        </div>
    </div>

</body>
</html>
