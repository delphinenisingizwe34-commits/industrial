<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isange Health Clinic</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #93d050; display: flex; justify-content: center; padding: 20px; }
        
        .container { width: 500px; background-color: #93d050; border: 2px solid #333; position: relative; padding-bottom: 20px; }

        /* Header */
        .header { background-color: #ffff00; padding: 15px; text-align: center; font-weight: bold; font-size: 20px; border-bottom: 1px solid #000; margin-left: 80px; }
        .red-cross { position: absolute; top: 5px; left: 5px; width: 60px; height: 60px; background-color: red; color: white; font-size: 50px; text-align: center; line-height: 60px; font-weight: bold; }

        /* Sidebar */
        .sidebar { float: left; width: 120px; background-color: white; height: 400px; margin: 20px 10px; padding: 10px; border: 1px solid #000; }
        .sidebar p { font-weight: bold; margin-bottom: 30px; cursor: pointer; }

        /* Main Registration Form */
        .main-panel { background-color: #00b0f0; margin-left: 160px; margin-top: 20px; padding: 20px; height: 350px; border: 1px solid #000; position: relative; }
        .title-reg { background-color: yellow; display: inline-block; padding: 2px 10px; font-style: italic; font-weight: bold; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; font-weight: bold; }
        input { border: none; border-bottom: 2px solid black; background: transparent; width: 150px; outline: none; }

        /* Buttons */
        .button-row { position: absolute; bottom: 20px; left: 10px; display: flex; gap: 10px; }
        button { border: 1px solid #333; padding: 5px 15px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-send { background-color: #92d050; }
        .btn-save { background-color: #00b050; }
        .btn-print { background-color: #ed7d31; }
        button:hover { opacity: 0.8; }

        /* Bottom Panel */
        .bottom-panel { clear: both; background-color: #5b9bd5; margin: 20px 40px; padding: 15px; text-align: center; color: white; border: 1px solid #000; }
    </style>
</head>
<body>

<div class="container">
    <div class="red-cross">+</div>
    <div class="header">ISANGE HEALTH CLINIC</div>

    <div class="sidebar">
        <a href="#">Home</a><br><br>
        <a href="del.html">APPOINTMENT</a><br><br>
        <a href="evy.html">PATIENT</a><br><br>
        <a href="iu.html">DASHBOARD</a><br><br>
    </div>

    <div class="main-panel">
        <div class="title-reg">PATIENT REGISTRATION</div>
        
        <div class="input-group">NAMES: <input type="text"></div>
        <div class="input-group">AGE: <input type="text"></div>
        <div class="input-group">GENDER: <input type="text"></div>

        <div class="button-row">
            <button class="btn-send" onclick="handleClick('Sending...')">SEND</button>
            <button class="btn-save" onclick="handleClick('Saving Data...')">SAVE</button>
            <button class="btn-print" onclick="handleClick('Preparing to Print...')">PRINT</button>
        </div>
    </div>

    <div class="bottom-panel">
        <div>APPOINTMENT PANEL</div>
        <div style="font-size: 14px; margin-top: 10px;">DATE/TIME/DOCTOR/STATUS</div>
    </div>
</div>

<script>
    function handleClick(message) {
        alert(message);
    }
</script>

</body>
</html>
