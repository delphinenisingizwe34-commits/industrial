<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Setting - Isange Health Clinic</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #ffe599; /* Light yellow background */
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        header {
            background-color: #5b9bd5; /* Blue header */
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #000;
        }

        header h1 {
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px #fff;
        }

        /* Main Layout */
        .container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 30px;
        }

        /* Sidebar Menu */
        .sidebar {
            background-color: #5b9bd5;
            width: 200px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar a {
            text-decoration: none;
            color: black;
            font-weight: bold;
            padding: 5px 10px;
            cursor: pointer;
        }

        .sidebar .active {
            background-color: #bf9000; /* Dark yellow/gold highlight */
            display: inline-block;
        }

        /* Configuration Panel */
        .config-panel {
            flex: 1;
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .clinic-input {
            width: 100%;
            height: 40px;
            background-color: #5b9bd5;
            border: 1px solid #000;
            margin-bottom: 20px;
        }

        /* Grid for settings */
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
        }

        .setting-item label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* Styled Buttons */
        .btn {
            padding: 10px 20px;
            border: 1px solid #333;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }

        .btn-french { background-color: #c55a11; color: black; }
        .btn-printer { background-color: #5b9bd5; color: black; }
        .btn-enable { background-color: #fbe5d6; color: black; }
        .btn-active { background-color: #f4b084; color: black; }

        /* Color Bar Buttons */
        .color-btns {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }

        .rect-btn { width: 80px; height: 25px; border: 1px solid #000; cursor: pointer; }
        .brown { background-color: #c55a11; }
        .green { background-color: #00b050; }
        .gold { background-color: #bf9000; }

        /* Status Footer */
        .status-bar {
            background-color: #5b9bd5;
            padding: 15px;
            margin-top: auto;
            text-align: center;
            font-weight: bold;
            border: 1px solid #000;
        }

        /* Click animation */
        button:active, .rect-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <header>
        <h1>System Setting</h1>
    </header>

    <div class="container">
        <nav class="sidebar">
            <a href="#">Menu</a>
            <a href="iu.html">Dashboard</a>
            <a href="evy">Patient</a>
            <a href="del.html>Appointment</a>
            <a href="de.html">Report</a>
            <a hre="ju.html">setting</a>
        </nav>

        <main class="config-panel">
            <div class="section-title">Configuration panel</div>
            
            <label>Clinic name</label>
            <div class="clinic-input"></div>

            <div class="settings-grid">
                <div class="setting-item">
                    <label>language</label>
                    <button class="btn btn-french" onclick="alert('Language changed to French')">french</button>
                </div>
                <div class="setting-item">
                    <label>printer</label>
                    <button class="btn btn-printer" onclick="alert('Printer settings opened')">default</button>
                </div>
                <div class="setting-item">
                    <label>Auto Back up:</label>
                    <button class="btn btn-enable" onclick="toggleBtn(this, 'Backup Enabled', 'Backup Disabled')">Enable</button>
                </div>
                <div class="setting-item">
                    <label>Offline Mode:</label>
                    <button class="btn btn-active" onclick="toggleBtn(this, 'Active', 'Inactive')">Active</button>
                </div>
            </div>

            <div class="color-btns">
                <div class="rect-btn brown" onclick="alert('Brown theme selected')"></div>
                <div class="rect-btn green" onclick="alert('Green theme selected')"></div>
                <div class="rect-btn gold" onclick="alert('Gold theme selected')"></div>
            </div>

            <div class="status-bar">
                System Ready > offline system
            </div>
        </main>
    </div>

    <script>
        function navTo(page) {
            alert("Navigating to " + page + " page...");
        }

        function toggleBtn(btn, text1, text2) {
            btn.innerText = (btn.innerText === text1) ? text2 : text1;
            alert("Status changed to: " + btn.innerText);
        }
    </script>

</body>
</html>
